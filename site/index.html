<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parlor — Classic Card Games</title>
<meta name="description" content="FreeCell and other classic card games. Plays offline.">
<meta name="theme-color" content="#1f5b43" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#143a2b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Parlor">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/parlor-mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<link rel="stylesheet" href="parlor/tokens.css">
<link rel="stylesheet" href="parlor/bundle.css">
<link rel="stylesheet" href="css/app.css">
<script src="parlor/bundle.js"></script>
</head>
<body>
<main class="pa-page">
  <header class="pa-head">
    <a class="pa-brand" href="./" aria-label="Parlor home">
      <img src="icons/parlor-mark.svg" alt="" width="44" height="44">
      <h1 class="pa-suite-title">Parlor</h1>
    </a>
    <div class="pa-head-actions">
      <button class="pa-icon-link" id="install" type="button" hidden>Install app</button>
      <button class="pa-icon-link" id="settings" type="button">Settings</button>
    </div>
  </header>

  <div class="pa-banner" id="update" hidden>
    <span>Update ready</span>
    <button class="pa-btn pa-btn-outline" id="update-btn" type="button">Restart</button>
  </div>
  <div class="pa-banner" id="ios-hint" hidden>
    <span>Add Parlor to your Home Screen: Share → Add to Home Screen.</span>
    <button class="pa-icon-link" id="ios-dismiss" type="button">Got it</button>
  </div>

  <section aria-labelledby="today-h">
    <h2 class="pa-section-title" id="today-h">Today</h2>
    <div class="pa-grid" id="today"></div>
  </section>

  <section aria-labelledby="games-h">
    <h2 class="pa-section-title" id="games-h">Games</h2>
    <div class="pa-grid" id="games"></div>
  </section>

  <footer class="pa-foot">
    <span>Free, no ads, no account. Plays offline.</span>
    <span id="version"></span>
  </footer>
</main>
<script type="module" src="js/launcher.js"></script>
</body>
</html>
