<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Today's deal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;family=Instrument+Sans:wght@400;600&amp;display=swap">
<style>
body{margin:0}
a{color:#1d1f1e}a:hover{color:#5b605c}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #f6f2e8; color: #1d1f1e; font-family: 'Instrument Sans', system-ui, sans-serif; display: flex; flex-direction: column; padding: 20px 20px; gap: 14px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <div style="font-family: Fraunces, Georgia, serif; font-size: 28px; line-height: 32px; font-weight: 600; letter-spacing: -0.01em">Parlor</div>
    <a href="Calendar.dc.html" style="display: flex; align-items: center; gap: 8px; min-height: 44px; font-size: 15px; font-weight: 600; text-decoration: none">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg>
      Stats
    </a>
  </div>

  <div style="background: #1f5b43; color: #f4efe3; border-radius: 16px; padding: 20px 20px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <div style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.06em; color: #bcd2c5">DAILY #1 · WEDNESDAY, NOV 25</div>
      <div style="font-family: Fraunces, Georgia, serif; font-size: 34px; line-height: 38px; font-weight: 600">Today's deal</div>
      <div style="font-size: 15px; line-height: 22px; color: #bcd2c5">FreeCell · Deal #11982</div>
    </div>

    <div style="display: flex; justify-content: center; padding: 0; height: 112px; position: relative">
      <div style="position: absolute; left: 92px; top: 14px; width: 72px; height: 100px; box-sizing: border-box; border-radius: 6px; background: #fbf7ec; box-shadow: 0 0 0 1px #d6ccb6 inset, 0 1px 2px rgba(0,0,0,0.28); transform: rotate(-10deg); padding: 6px">
        <div style="position: absolute; inset: 6px; border-radius: 4px; background: #7d1f2c; background-image: repeating-linear-gradient(45deg, #a84353 0 1px, transparent 1px 8px), repeating-linear-gradient(-45deg, #a84353 0 1px, transparent 1px 8px)"></div>
      </div>
      <div style="position: absolute; left: 159px; top: 6px; width: 72px; height: 100px; box-sizing: border-box; border-radius: 6px; background: #fbf7ec; box-shadow: 0 0 0 1px #d6ccb6 inset, 0 1px 2px rgba(0,0,0,0.28); color: #b3261e; font-family: Fraunces, Georgia, serif; font-weight: 600">
        <div style="position: absolute; left: 6px; right: 6px; top: 5px; display: flex; justify-content: space-between; align-items: center; font-size: 20px; line-height: 20px">Q<svg width="16" height="16" viewBox="0 0 24 24" fill="#b3261e" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.1C.9 8.6 2.9 4.5 6.6 4.5c2.2 0 3.7 1.3 4.4 2.6.7-1.3 2.2-2.6 4.4-2.6 3.7 0 5.7 4.1 4.2 7.4C19.5 16.4 12 21 12 21z"></path></svg></div>
        <div style="position: absolute; left: 10px; right: 10px; top: 30px; bottom: 22px; border: 1px solid #b3261e; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: 500">Q</div>
      </div>
      <div style="position: absolute; left: 226px; top: 14px; width: 72px; height: 100px; box-sizing: border-box; border-radius: 6px; background: #fbf7ec; box-shadow: 0 0 0 1px #d6ccb6 inset, 0 1px 2px rgba(0,0,0,0.28); transform: rotate(10deg); color: #1d1f1e; font-family: Fraunces, Georgia, serif; font-weight: 600">
        <div style="position: absolute; left: 6px; right: 6px; top: 5px; display: flex; justify-content: space-between; align-items: center; font-size: 20px; line-height: 20px">A<svg width="16" height="16" viewBox="0 0 24 24" fill="#1d1f1e" aria-hidden="true"><path d="M12 2s-8 6-8 11a4 4 0 0 0 7 2.6V18l-2 3h6l-2-3v-2.4A4 4 0 0 0 20 13c0-5-8-11-8-11z"></path></svg></div>
        <div style="position: absolute; inset: 30px 0 18px; display: flex; align-items: center; justify-content: center"><svg width="40" height="40" viewBox="0 0 24 24" fill="#1d1f1e" aria-hidden="true"><path d="M12 2s-8 6-8 11a4 4 0 0 0 7 2.6V18l-2 3h6l-2-3v-2.4A4 4 0 0 0 20 13c0-5-8-11-8-11z"></path></svg></div>
      </div>
    </div>

    <a href="Result.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 10px; background: #d4ad55; color: #2a2110; font-size: 17px; font-weight: 600; text-decoration: none">Play today's deal</a>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
    <div style="background: #ffffff; border-radius: 10px; padding: 12px 12px; box-shadow: 0 1px 2px rgba(29,31,30,0.08), 0 6px 18px rgba(29,31,30,0.08); display: flex; flex-direction: column; gap: 4px">
      <div style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.06em; color: #5b605c">STREAK</div>
      <div style="font-size: 22px; line-height: 26px; font-weight: 600; font-variant-numeric: tabular-nums">3 days</div>
    </div>
    <div style="background: #ffffff; border-radius: 10px; padding: 12px 12px; box-shadow: 0 1px 2px rgba(29,31,30,0.08), 0 6px 18px rgba(29,31,30,0.08); display: flex; flex-direction: column; gap: 4px">
      <div style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.06em; color: #5b605c">SOLVED</div>
      <div style="font-size: 22px; line-height: 26px; font-weight: 600; font-variant-numeric: tabular-nums">5 of 6</div>
    </div>
    <div style="background: #ffffff; border-radius: 10px; padding: 12px 12px; box-shadow: 0 1px 2px rgba(29,31,30,0.08), 0 6px 18px rgba(29,31,30,0.08); display: flex; flex-direction: column; gap: 4px">
      <div style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.06em; color: #5b605c">BEST</div>
      <div style="font-size: 22px; line-height: 26px; font-weight: 600; font-variant-numeric: tabular-nums">2:58</div>
    </div>
  </div>

  <div style="background: #ffffff; border-radius: 10px; padding: 16px; box-shadow: 0 1px 2px rgba(29,31,30,0.08), 0 6px 18px rgba(29,31,30,0.08); display: flex; flex-direction: column; gap: 10px">
    <div style="font-size: 15px; line-height: 22px; font-weight: 600">This week</div>
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
      <sc-for list="{{week}}" as="d" hint-placeholder-count="7">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
          <div style="width: 30px; height: 30px; border-radius: 6px; box-sizing: border-box; border: {{d.border}}; background: {{d.fill}}"></div>
          <div style="font-size: 12px; line-height: 16px; color: #5b605c">{{d.day}}</div>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="margin-top: auto; display: flex; align-items: center; justify-content: flex-end; border-top: 1px solid #e2dccf; padding-top: 16px">
    <a href="#" style="display: flex; align-items: center; min-height: 44px; padding: 0 14px; border: 1px solid #7f847d; border-radius: 10px; font-size: 15px; font-weight: 600; text-decoration: none">Tip the table</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const days = ['Th','Fr','Sa','Su','Mo','Tu','We'];
    const st = ['solved','solved','missed','solved','solved','solved','today'];
    return {
      week: days.map((day, i) => ({
        day,
        fill: st[i] === 'solved' ? '#1f5b43' : st[i] === 'today' ? '#f6f2e8' : '#e2dccf',
        border: st[i] === 'today' ? '2px solid #d4ad55' : '0 solid transparent'
      }))
    };
  }
}
</script>
</body>
</html>
