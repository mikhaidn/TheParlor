<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Replay of a Daily solve</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;family=Instrument+Sans:wght@400;600&amp;family=JetBrains+Mono:wght@400&amp;display=swap">
<style>
body{margin:0}
a{color:#1d1f1e}a:hover{color:#5b605c}
button{font-family:inherit}
input[type=range]{accent-color:#d4ad55}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #1f5b43; color: #f4efe3; font-family: 'Instrument Sans', system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="display: flex; align-items: center; gap: 4px; margin: 12px 12px 0; padding: 0 8px 0 4px; min-height: 52px; border-radius: 10px; background: #17462f">
    <a href="ReplayGate.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #f4efe3">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <span style="font-family: Fraunces, Georgia, serif; font-size: 20px; line-height: 26px; font-weight: 600">Replay</span>
    <span style="font-size: 15px; color: #bcd2c5">· Daily #2</span>
    <span style="margin-left: auto; font-size: 13px; color: #bcd2c5; font-variant-numeric: tabular-nums">3:18</span>
  </div>

  <div style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 5px; padding: 12px 12px 0">
    <sc-for list="{{top}}" as="p" hint-placeholder-count="8">
      <div style="{{p.slotCss}}">
        <sc-if value="{{p.empty}}" hint-placeholder-val="{{ true }}">
          <sc-if value="{{p.isHome}}" hint-placeholder-val="{{ false }}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="#8fb9a3" aria-hidden="true"><path d="{{p.watermark}}"></path></svg>
          </sc-if>
        </sc-if>
        <sc-for list="{{p.cards}}" as="c" hint-placeholder-count="1">
          <div style="{{c.css}}"><span style="{{c.idxCss}}">{{c.rank}}<svg width="9" height="9" viewBox="0 0 24 24" fill="{{c.ink}}" aria-hidden="true"><path d="{{c.d}}"></path></svg></span></div>
        </sc-for>
      </div>
    </sc-for>
  </div>

  <div style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 5px; padding: 12px 12px 0; height: 236px">
    <sc-for list="{{cols}}" as="p" hint-placeholder-count="8">
      <div style="position: relative">
        <div style="position: absolute; left: 0; right: 0; top: 0; height: 57px; border-radius: 4px; background: #17462f; box-shadow: 0 0 0 1px #8fb9a3 inset"></div>
        <sc-for list="{{p.cards}}" as="c" hint-placeholder-count="6">
          <div style="{{c.css}}"><span style="{{c.idxCss}}">{{c.rank}}<svg width="9" height="9" viewBox="0 0 24 24" fill="{{c.ink}}" aria-hidden="true"><path d="{{c.d}}"></path></svg></span></div>
        </sc-for>
      </div>
    </sc-for>
  </div>

  <section aria-label="Replay controls" style="margin-top: auto; background: #ffffff; color: #1d1f1e; border-radius: 16px 16px 0 0; padding: 14px 20px 20px; display: flex; flex-direction: column; gap: 12px">
    <div role="group" aria-label="Which moves to show" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; background: #f6f2e8; border-radius: 10px; padding: 4px">
      <sc-for list="{{modes}}" as="m" hint-placeholder-count="2">
        <button type="button" aria-pressed="{{m.on}}" onClick="{{m.pick}}" style="min-height: 40px; border: 0; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; {{m.css}}">{{m.label}}</button>
      </sc-for>
    </div>

    <div aria-live="polite" style="display: flex; align-items: center; gap: 12px; min-height: 48px">
      <div style="flex: none; font-size: 22px; line-height: 26px; font-weight: 600; font-variant-numeric: tabular-nums">{{stepLabel}}</div>
      <span style="flex: none; display: inline-flex; align-items: center; height: 28px; padding: 0 8px; border-radius: 4px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 14px; {{noteCss}}">{{note}}</span>
      <div style="font-size: 14px; line-height: 19px; color: #5b605c">{{desc}}</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 2px">
      <div aria-hidden="true" style="display: flex; align-items: flex-end; gap: 1px; height: 22px">
        <sc-for list="{{ticks}}" as="t" hint-placeholder-count="83">
          <div style="{{t.css}}"></div>
        </sc-for>
      </div>
      <input type="range" aria-label="Scrub through moves" min="0" max="{{maxStep}}" step="1" value="{{step}}" onChange="{{scrub}}" style="width: 100%; height: 28px; margin: 0">
      <div style="display: flex; gap: 14px; font-size: 12px; line-height: 16px; color: #5b605c">
        <span style="display: flex; align-items: center; gap: 5px"><span style="width: 8px; height: 12px; border-radius: 2px; background: #9b9686"></span>Move</span>
        <span style="display: flex; align-items: center; gap: 5px"><span style="width: 8px; height: 12px; border-radius: 2px; background: #1f5b43"></span>Card home</span>
        <span style="display: flex; align-items: center; gap: 5px"><span style="width: 8px; height: 12px; border-radius: 2px; background: #b3261e"></span>Undo</span>
      </div>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between">
      <button type="button" aria-label="Back to start" onClick="{{first}}" style="width: 48px; height: 48px; border: 0; border-radius: 10px; background: transparent; color: #1d1f1e; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 5v14M18 6l-8 6 8 6z"></path></svg>
      </button>
      <button type="button" aria-label="Previous move" onClick="{{prev}}" style="width: 48px; height: 48px; border: 0; border-radius: 10px; background: transparent; color: #1d1f1e; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
      </button>
      <button type="button" aria-label="{{playAria}}" onClick="{{togglePlay}}" style="width: 64px; height: 56px; border: 0; border-radius: 10px; background: #d4ad55; color: #2a2110; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <sc-if value="{{playing}}" hint-placeholder-val="{{ false }}">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"></path></svg>
        </sc-if>
        <sc-if value="{{paused}}" hint-placeholder-val="{{ true }}">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5l11 7-11 7z"></path></svg>
        </sc-if>
      </button>
      <button type="button" aria-label="Next move" onClick="{{next}}" style="width: 48px; height: 48px; border: 0; border-radius: 10px; background: transparent; color: #1d1f1e; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </button>
      <button type="button" aria-label="{{speedAria}}" onClick="{{cycleSpeed}}" style="width: 48px; height: 48px; border: 1px solid #7f847d; border-radius: 10px; background: transparent; color: #1d1f1e; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; cursor: pointer">{{speedLabel}}</button>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; border-top: 1px solid #e2dccf; padding-top: 10px">
      <div style="font-size: 13px; line-height: 18px; color: #5b605c">Take over at this point. It’s practice, so it won’t count.</div>
      <button type="button" style="flex: none; min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid #7f847d; background: transparent; color: #1d1f1e; font-size: 15px; font-weight: 600; cursor: pointer">Play from here</button>
    </div>
  </section>
</div>
</x-dc>

  stop() { clearInterval(this.timer); this.timer = null; }
  start(speed) {
    this.stop();
    this.timer = setInterval(() => {
      const len = this.data()[this.state.mode].length - 1;
      if (this.state.step >= len) { this.stop(); this.setState({ playing: false }); return; }
      this.setState({ step: this.state.step + 1 });
    }, 700 / speed);
  }
  renderVals() {
    const s = this.state, D = this.data(), L = D[s.mode], max = L.length - 1, step = Math.min(s.step, max), cur = L[step];
    const SUIT = {
      h: 'M12 21s-7.5-4.6-9.6-9.1C.9 8.6 2.9 4.5 6.6 4.5c2.2 0 3.7 1.3 4.4 2.6.7-1.3 2.2-2.6 4.4-2.6 3.7 0 5.7 4.1 4.2 7.4C19.5 16.4 12 21 12 21z',
      s: 'M12 2s-8 6-8 11a4 4 0 0 0 7 2.6V18l-2 3h6l-2-3v-2.4A4 4 0 0 0 20 13c0-5-8-11-8-11z',
      d: 'M12 2l8 10-8 10-8-10z',
      c: 'M12 3a3.8 3.8 0 0 1 3.6 5A3.8 3.8 0 1 1 13.4 15l1.1 6h-5l1.1-6a3.8 3.8 0 1 1-2.2-7A3.8 3.8 0 0 1 12 3z',
    };
    const RED = { h: 1, d: 1 };
    const piles = cur.s.split('|');
    const cardsOf = (str, pos, fan) => {
      const out = [];
      for (let i = 0; i < str.length; i += 2) {
        const r = str[i], su = str[i + 1], k = i / 2, last = i + 2 >= str.length;
        const ring = last && pos === cur.hl ? ', 0 0 0 2px #f4d27a' : '';
        const ink = RED[su] ? '#b3261e' : '#1d1f1e';
        out.push({
          rank: r === 'T' ? '10' : r, d: SUIT[su], ink,
          css: `position: absolute; left: 0; right: 0; top: ${k * fan}px; height: 57px; box-sizing: border-box; border-radius: 4px; background: #fbf7ec; box-shadow: 0 0 0 1px #d6ccb6 inset, 0 1px 2px rgba(0,0,0,0.28)${ring}; z-index: ${k + 1}`,
          idxCss: `position: absolute; left: 3px; right: 2px; top: 3px; display: flex; align-items: center; justify-content: space-between; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 13px; line-height: 13px; color: ${ink}`,
        });
      }
      return out;
    };
    const top = piles.slice(0, 8).map((p, i) => ({
      empty: !p.length, isHome: i >= 4, watermark: SUIT['shdc'[i - 4]] || '',
      slotCss: `position: relative; height: 57px; border-radius: 4px; background: #17462f; box-shadow: 0 0 0 1px #8fb9a3 inset${!p.length && i === cur.hl ? ', 0 0 0 2px #f4d27a' : ''}; display: flex; align-items: center; justify-content: center`,
      cards: cardsOf(p, i, 0),
    }));
    const cols = piles.slice(8).map((p, i) => ({ cards: cardsOf(p, i + 8, 17) }));

    const ticks = L.slice(1).map((x, i) => {
      const done = i + 1 <= step, now = i + 1 === step;
      const bg = now ? '#d4ad55' : x.k === 'undo' ? '#b3261e' : x.k === 'home' || x.auto ? '#1f5b43' : '#9b9686';
      const h = now ? 22 : x.k === 'undo' ? 18 : x.k === 'home' || x.auto ? 14 : 10;
      return { css: `flex: 1 1 0; min-width: 0; height: ${h}px; border-radius: 1px; background: ${bg}; opacity: ${done || now ? 1 : 0.35}` };
    });

    const undos = D.full.filter((x) => x.k === 'undo').length;
    const setStep = (n) => this.setState({ step: Math.max(0, Math.min(max, n)) });
    const SPEEDS = [1, 2, 4];

      top, cols, ticks, step, maxStep: max,
      modes: [['full', 'As played · ' + (D.full.length - 1)], ['clean', 'Clean line · ' + (D.clean.length - 1)]].map(([id, label]) => ({
        label, on: s.mode === id,
        css: s.mode === id ? 'background: #ffffff; color: #1d1f1e; box-shadow: 0 1px 2px rgba(29,31,30,0.16)' : 'background: transparent; color: #5b605c',
        pick: () => {
          // keep roughly the same place in the game when switching
          const frac = step / max, other = D[id].length - 1;
          this.setState({ mode: id, step: Math.round(frac * other) });
        },
      })),
      stepLabel: step + ' / ' + max,
      note: cur.n || 'start',
      noteCss: cur.k === 'undo' ? 'background: #f8e3e1; color: #8c1d17' : 'background: #f6f2e8; color: #1d1f1e',
      desc: cur.d + (s.mode === 'full' && step === 0 ? ` · ${undos} undos along the way` : ''),
      scrub: (e) => setStep(Number(e.target.value)),
      first: () => setStep(0), prev: () => setStep(step - 1), next: () => setStep(step + 1),
      playing: s.playing, paused: !s.playing, playAria: s.playing ? 'Pause' : 'Play',
      togglePlay: () => {
        if (s.playing) { this.stop(); this.setState({ playing: false }); }
        else { if (step >= max) this.setState({ step: 0 }); this.start(s.speed); this.setState({ playing: true }); }
      },
      speedLabel: s.speed + '×', speedAria: 'Speed ' + s.speed + '×',
      cycleSpeed: () => { const sp = SPEEDS[(SPEEDS.indexOf(s.speed) + 1) % SPEEDS.length]; this.setState({ speed: sp }); if (s.playing) this.start(sp); },
    };
  }
